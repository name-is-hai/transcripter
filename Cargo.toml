[package]
name = "transcripter"
version = "0.1.2"
edition = "2024"
description = "Inspect, extract, and add subtitle tracks in MKV files"
authors = ["Vu Dao Ngoc Hai"]
license = "MIT"

[features]
default = []
bundled-media-tools = ["dep:sha2"]
gui-core = ["dep:gpui"]
gui = ["gui-core", "gpui/wayland", "gpui/x11"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gpui = { version = "0.2.2", optional = true, default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3.18"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
