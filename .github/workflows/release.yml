name: Build portable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FFMPEG_VERSION: 8.0.1
  FFMPEG_SHA256: 05ee0b03119b45c0bdb4df654b96802e909e0a752f72e4fe3794f487229e5a41

jobs:
  test:
    name: Test core and CLI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - name: Install test media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Run tests
        run: cargo test --locked --lib --test cli

  linux:
    name: Linux ${{ matrix.arch }} portable executable
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            ffmpeg \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            xz-utils
      - name: Build minimal LGPL FFmpeg helpers
        run: scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
      - name: Test the embedded helpers
        env:
          TRANSCRIPTER_FFMPEG_BIN: ${{ runner.temp }}/ffmpeg/bin/ffmpeg
          TRANSCRIPTER_FFPROBE_BIN: ${{ runner.temp }}/ffmpeg/bin/ffprobe
        run: cargo test --locked --features bundled-media-tools --lib --test cli
      - name: Build unified GUI and CLI executable
        env:
          TRANSCRIPTER_FFMPEG_BIN: ${{ runner.temp }}/ffmpeg/bin/ffmpeg
          TRANSCRIPTER_FFPROBE_BIN: ${{ runner.temp }}/ffmpeg/bin/ffprobe
        run: cargo build --release --locked --features gui,bundled-media-tools --bin transcripter
      - name: Package one-file Linux executable
        run: |
          chmod +x scripts/package-linux.sh
          scripts/package-linux.sh \
            target/release/transcripter \
            "dist/transcripter-linux-${{ matrix.arch }}.run"
          "dist/transcripter-linux-${{ matrix.arch }}.run" licenses
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/transcripter-linux-${{ matrix.arch }}.run
          if-no-files-found: error

  windows_ffmpeg:
    name: Build Windows FFmpeg helpers
    needs: test
    runs-on: windows-2025
    env:
      CHERE_INVOKING: "1"
      MSYSTEM: UCRT64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - name: Install MinGW build tools
        shell: 'C:\msys64\usr\bin\bash.exe -leo pipefail {0}'
        run: |
          pacman -S --noconfirm --needed \
            curl \
            diffutils \
            make \
            mingw-w64-ucrt-x86_64-gcc \
            xz
      - name: Build minimal LGPL FFmpeg helpers
        shell: 'C:\msys64\usr\bin\bash.exe -leo pipefail {0}'
        run: |
          export PATH="/ucrt64/bin:$PATH"
          workspace=$(cygpath -u "$GITHUB_WORKSPACE")
          cd "$workspace"
          scripts/build-ffmpeg.sh /tmp/transcripter-ffmpeg
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: build-windows-ffmpeg-x86_64
          path: |
            C:\msys64\tmp\transcripter-ffmpeg\bin\ffmpeg.exe
            C:\msys64\tmp\transcripter-ffmpeg\bin\ffprobe.exe
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows ${{ matrix.arch }} portable executable
    needs: [test, windows_ffmpeg]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, Node 24
        with:
          name: build-windows-ffmpeg-x86_64
          path: helper
      - name: Verify bundled helper compatibility
        shell: pwsh
        run: '& .\helper\ffprobe.exe -version'
      - name: Select Rust target
        shell: pwsh
        run: rustup target add "${{ matrix.target }}"
      - name: Build unified GUI and CLI executable
        shell: pwsh
        env:
          TRANSCRIPTER_FFMPEG_BIN: ${{ github.workspace }}\helper\ffmpeg.exe
          TRANSCRIPTER_FFPROBE_BIN: ${{ github.workspace }}\helper\ffprobe.exe
          RUSTFLAGS: -C target-feature=+crt-static
        run: >-
          cargo build --release --locked
          --target "${{ matrix.target }}"
          --features gui,bundled-media-tools
          --bin transcripter
      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\transcripter.exe" "dist\transcripter-windows-${{ matrix.arch }}.exe"
          Get-Item "dist\transcripter-windows-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/transcripter-windows-${{ matrix.arch }}.exe
          if-no-files-found: error
      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          $executable = (Resolve-Path "dist\transcripter-windows-${{ matrix.arch }}.exe").Path
          $process = Start-Process -FilePath $executable -ArgumentList "--version" -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows executable exited with code $($process.ExitCode)"
          }

  macos:
    name: macOS ${{ matrix.arch }} application
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - name: Select Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build minimal LGPL FFmpeg helpers
        run: scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
      - name: Build unified GUI and CLI executable
        env:
          TRANSCRIPTER_FFMPEG_BIN: ${{ runner.temp }}/ffmpeg/bin/ffmpeg
          TRANSCRIPTER_FFPROBE_BIN: ${{ runner.temp }}/ffmpeg/bin/ffprobe
        run: >-
          cargo build --release --locked
          --target "${{ matrix.target }}"
          --features gui,bundled-media-tools
          --bin transcripter
      - name: Package macOS application
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          chmod +x scripts/package-macos.sh
          scripts/package-macos.sh \
            "target/${{ matrix.target }}/release/transcripter" \
            "${{ matrix.arch }}" \
            "dist/transcripter-macos-${{ matrix.arch }}.tar.gz"
          "target/${{ matrix.target }}/release/transcripter" licenses
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/transcripter-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, Node 24
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Add license materials and checksums
        run: |
          curl --fail --location --silent --show-error \
            "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            --output "release/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          echo "$FFMPEG_SHA256  release/ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            | sha256sum --check
          cp LICENSE THIRD_PARTY_NOTICES.md release/
          cd release
          sha256sum \
            transcripter-linux-x86_64.run \
            transcripter-linux-arm64.run \
            transcripter-windows-x86_64.exe \
            transcripter-windows-arm64.exe \
            transcripter-macos-x86_64.tar.gz \
            transcripter-macos-arm64.tar.gz \
            ffmpeg-${FFMPEG_VERSION}.tar.xz \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            > SHA256SUMS
      - name: Create GitHub Release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/* \
            --generate-notes \
            --title "Transcripter ${GITHUB_REF_NAME}" \
            --verify-tag
